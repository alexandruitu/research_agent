name: research-agent
# One LAN machine. From the repository root: docker compose -f deploy/docker-compose.yml up -d --build
# Settings come from deploy/.env (copy deploy/.env.example). Only `proxy` publishes ports.

x-image: &image
  image: research-agent:${IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile

x-app-env: &app-env
  RESEARCH_WEB_DATABASE_URL: postgresql+psycopg://research:${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}@db:5432/research
  RESEARCH_SECRETS_KEY: ${RESEARCH_SECRETS_KEY:?set RESEARCH_SECRETS_KEY in deploy/.env}
  RESEARCH_WEB_DEV_MODE: "false"
  RESEARCH_WEB_ALLOW_DEMO: "false"
  RESEARCH_WEB_COOKIE_SECURE: "true"

# The app containers: read-only root, no Linux capabilities, no privilege gain. They write only to their
# volumes and to a small /tmp.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp:size=256m
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: postgres:16
    security_opt: ["no-new-privileges:true"]
    shm_size: 256m
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # One-shot: migrations under a PostgreSQL advisory lock, then the first admin, sign-up domains and contact
  # address (only while none is set). Safe to repeat; api and worker start only after it succeeded.
  migrate:
    <<: [*image, *hardened]
    command: ["research-web", "bootstrap"]
    environment:
      <<: *app-env
      RESEARCH_WEB_ADMIN_EMAIL: ${RESEARCH_WEB_ADMIN_EMAIL:-}
      RESEARCH_WEB_ADMIN_PASSWORD: ${RESEARCH_WEB_ADMIN_PASSWORD:-}
      RESEARCH_WEB_SIGNUP_DOMAINS: ${RESEARCH_WEB_SIGNUP_DOMAINS:-}
      RESEARCH_WEB_CONTACT_EMAIL: ${RESEARCH_WEB_CONTACT_EMAIL:-}
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: [*image, *hardened]
    command: ["research-web", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-env
      # only Caddy, on the edge network, may set X-Forwarded-For (the per-IP sign-in limits use it)
      RESEARCH_WEB_FORWARDED_ALLOW_IPS: ${EDGE_SUBNET:-172.31.250.0/24}
    networks: [default, edge]
    mem_limit: ${API_MEMORY:-1g}
    volumes:
      - runs:/data/runs:ro
      - uploads:/data/uploads  # uploaded PDFs (the API writes them)
      - ${EVALS_DIR:-evals}:/data/evals:ro
      - ${GOLD_DIR:-gold}:/data/gold:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: [*image, *hardened]
    command: ["research-web", "worker"]
    mem_limit: ${WORKER_MEMORY:-2g}
    init: true  # PID 1 forwards docker stop's SIGTERM, so the worker stops its child and requeues the job
    stop_grace_period: 30s
    environment:
      <<: *app-env
      RESEARCH_AGENT_CONTACT: ${RESEARCH_WEB_CONTACT_EMAIL:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      http_proxy: ${HTTP_PROXY:-}
      no_proxy: ${NO_PROXY:-}
    volumes:
      - runs:/data/runs
      - cache:/data/cache
      - uploads:/data/uploads:ro  # copied into each run folder
      - ${EVALS_DIR:-evals}:/data/evals:ro
      - ${GOLD_DIR:-gold}:/data/gold:ro
    env_file:
      - path: worker.env  # optional search-source keys (deploy/worker.env.example); never LLM keys
        required: false
    healthcheck:
      disable: true  # no HTTP port; `docker compose logs worker` and Settings show its state
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  proxy:
    image: caddy:2
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks: [edge]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
      CADDY_TLS: ${CADDY_TLS:-internal}
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddydata:/data  # Caddy's internal CA and certificates
      - caddyconfig:/config
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "443"]
      interval: 15s
      timeout: 3s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  default: {}
  # Caddy <-> API only, on a fixed subnet so the API can trust exactly this range for X-Forwarded-For.
  # Change EDGE_SUBNET in deploy/.env if it clashes with a network on the host or the LAN.
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.31.250.0/24}

volumes:
  dbdata: {}
  runs: {}
  cache: {}
  uploads: {}
  evals: {}
  gold: {}
  caddydata: {}
  caddyconfig: {}
