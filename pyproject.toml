[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-agent-v1"
version = "0.1.0"
description = "Auditable, abstract-level scientific research pipeline"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "pydantic>=2.10,<3", "httpx>=0.28,<1", "langchain>=1,<2", "python-dotenv>=1,<2", "pyyaml>=6,<7"]

[project.optional-dependencies]
live = ["langchain-openai>=1,<2", "langchain-anthropic>=1,<2"]
ui = ["streamlit>=1.45,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
research-agent = "research_agent.cli:main"
research-ui = "research_agent.ui_launcher:main"
research-eval = "research_agent.eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs real API keys; skipped when they are absent"]

[tool.ruff]
line-length = 110
