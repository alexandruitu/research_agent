name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev,live,web,web-dev]' pip-audit
      - run: ruff check .
      - run: pytest -q
      - run: pip-audit

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e '.[web]'
      - name: Frontend checks
        working-directory: web
        run: |
          npm ci
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    env:
      # the pipeline child must never load a .env, even if one appears in the checkout
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e '.[dev,live,web,web-dev]'
      - name: Browser tests
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate and build the images
        run: |
          cp deploy/.env.example deploy/.env
          sed -i -e 's/^DB_PASSWORD=$/DB_PASSWORD=ci-only/' -e 's/^SITE_ADDRESS=$/SITE_ADDRESS=localhost/' \
            -e 's/^RESEARCH_SECRETS_KEY=$/RESEARCH_SECRETS_KEY=ci-only-not-a-key/' deploy/.env
          docker compose -f deploy/docker-compose.yml config > /dev/null
          docker build -f deploy/Dockerfile -t research-agent:ci .
