name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev,live,ui,web,web-dev]' pip-audit
      - run: ruff check .
      - run: pytest -q
      - run: pip-audit

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e '.[web]'
      - name: Frontend checks
        working-directory: web
        run: |
          npm ci
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    env:
      # the pipeline child must never load a .env, even if one appears in the checkout
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e '.[dev,live,ui,web,web-dev]'
      - name: Browser tests
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build the images
        run: |
          cp deploy/.env.example deploy/.env && sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=ci-only/' deploy/.env
          cp deploy/worker.env.example deploy/worker.env
          docker compose -f deploy/docker-compose.yml config > /dev/null
          docker build -f deploy/Dockerfile -t research-agent-api .
          docker build -f deploy/Dockerfile.web -t research-agent-web .
